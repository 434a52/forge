# CI — the gates that were, until now, a person remembering to run each command by hand.
#
# Four jobs answering three questions:
#
#   engine   — do the *sources* still produce the committed generated output?
#              (go test + `c5n check`, the drift-guard)
#   csharp   \  do the *committed* generated files still compile, in each target?
#   ts       /  (one job per target toolchain)
#   conform  — do both languages agree with one language-neutral vector dataset?
#              (cmd/conform driving each language's run-vector CLI)
#
# They are deliberately independent, not chained: a drift failure, a compile failure and a
# conformance failure are three different diagnoses, and seeing them together beats seeing
# the first one three times.
#
# Per c5n/DESIGN.md there are two checks per target — "compiles?" and "conforms?" — and
# both now exist. The `conform` job is where the two languages meet, and it is one job
# already; the compile jobs stay separate because they genuinely do not share a command
# (`dotnet build` against `npm ci && tsc`, behind different setup actions). A matrix over
# them would need a condition on every step and would blur which target failed, so it was
# considered and dropped rather than deferred — see c5n/PLAN.md → 3.5.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved, and build-time tooling
# is the highest-risk supply-chain surface (llm/synced/design-rigour.md). Updates to those
# pins arrive as Dependabot PRs — see .github/dependabot.yml, which is the half that makes
# pinning safe rather than merely frozen.
#
# Toolchain versions are pinned only as tightly as today's checks justify; tightening them
# is a tracked task (c5n/PLAN.md → Rooms).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine (go test + drift-guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned by go.mod rather than restated here — one statement of the version,
          # and CI cannot drift from the module it is testing.
          go-version-file: c5n/go.mod
          # setup-go looks for the module at the repo root by default, so the cache key
          # has to be pointed at the real one — without this the module cache never hits.
          cache-dependency-path: c5n/go.sum

      - name: go test
        working-directory: c5n
        run: go test ./...

      - name: c5n check (drift-guard)
        working-directory: c5n
        run: |
          go build -o "$RUNNER_TEMP/c5n" ./cmd/c5n
          "$RUNNER_TEMP/c5n" check ../f8n

  csharp:
    name: csharp (generated output compiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Feature band, deliberately. An exact pin guards against a runtime-library bump
          # moving a *result*, and f8n has no result that a bump can move: every parser is a
          # character walk, every format is invariant-culture, and the arithmetic is on big
          # integers. The dependency an exact pin would guard has been engineered out rather
          # than pinned around, which is the stronger version of the same guarantee.
          #
          # The real trigger is the first behaviour that reads the runtime's locale data —
          # l10n's formatting, where ICU *is* the subject. Pin exactly then, in the job that
          # measures it. See c5n/PLAN.md → Rooms.
          dotnet-version: '10.0.x'

      - name: dotnet build
        working-directory: f8n/dotnet
        run: dotnet build --nologo

  conform:
    name: conform (both languages against one dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: c5n/go.mod
          cache-dependency-path: c5n/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: build the runners
        run: |
          dotnet build f8n/dotnet/RunVector --nologo
          npm ci --prefix f8n/ts
          npm run build --prefix f8n/ts

      # The driver owns the comparison, so this is the only place a divergence is judged —
      # and the same invocation is what a third party would use to audit their own
      # implementation against the dataset.
      - name: conform
        working-directory: c5n
        run: |
          go build -o "$RUNNER_TEMP/conform" ./cmd/conform
          cd ..
          # Every dataset, found rather than listed: a hardcoded list is one more place to
          # forget, and a vector file nobody runs is worse than no vector file at all.
          for vectors in f8n/vectors/*.json; do
            "$RUNNER_TEMP/conform" \
              -vectors "$vectors" \
              -runner "csharp=dotnet run --project f8n/dotnet/RunVector --no-build --" \
              -runner "ts=node f8n/ts/dist/run-vector.js"
          done

  ts:
    name: ts (generated output typechecks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Feature band, matching the .NET pin in the csharp job above and for the same
          # reason. What actually fixes the TypeScript version is the committed lockfile plus
          # `npm ci`; Node's own version barely touches tsc's output.
          node-version: '22.x'

      # `npm ci` installs strictly from the committed lockfile — a locked install, not a
      # resolve-and-update, so CI cannot silently pick up a different TypeScript.
      - name: npm ci
        working-directory: f8n/ts
        run: npm ci

      - name: tsc --noEmit
        working-directory: f8n/ts
        run: npm run typecheck
