# c5n build manifest — the single authoritative statement of targets + I/O, and the
# manifest the drift-guard checks against (all targets, all paths in one place).
#
# NOTE: the files under the `out:` dirs started life hand-written — the byte-for-byte
# target `c5n build` had to reproduce. It does, so they are now generated, and `c5n check`
# fails if they ever drift from these sources.
#
# namespace is F8n (NOT a sub-namespace): the generated tables are `partial class`
# extensions of the hand-written Currency/Country, so they must share their namespace.
targets:
  csharp: { out: dotnet/Generated/, namespace: F8n }
  ts:     { out: ts/src/generated/ }
sources:
  schema: schema/*.yaml
  data:   data/**/*.yaml
