# f8n type schema — declared once, language-blind except construction recipes.
# c5n reads this to know how to construct instances; the type *bodies* are hand-written
# runtime code (external: true), so c5n emits ctor calls, never the class definitions.
#
# Convention: a table<T> emits one named constant per row, named from the field the type's
# `key:` points at. The key is an ordinary declared field (no magic map key) — so data is
# authored as a plain list and the id appears once, in the row. `key:` is also the reference
# target: a Country's `defaultCurrency: GBP` resolves against Currency's key field (code).
# No `emit:` overrides needed here (all scalar/reference fields, no decimals).

Currency:
  external: true
  key: code                    # identity → names Currency.GBP; the defaultCurrency ref target
  # symbol = default/canonical symbol only; locale-specific presentation is l10n's
  fields: { code: string, numeric: int, name: string, symbol: string, minorUnits: int }

Country:
  external: true
  key: alpha3                  # identity → names Country.GBR
  fields: { alpha2: string, alpha3: string, numeric: int, name: string, callingCode: int,
            defaultCurrency: Currency, capitalTz: string }

# Enums are generated: c5n emits the type *body* in each target, and their members are
# declared here rather than collected from data. A data value therefore *selects* a member
# and can never create one — which matters more than it looks, because an enum serialises
# as text (see f8n/DESIGN.md -> Wire format): the member name is the token on the wire, so a
# typo that minted a member would mint a wire token with it.
#
# Member names are emitted verbatim in every target — no casing is applied anywhere, which
# is the only rule under which VAT survives as VAT rather than Vat.

TaxType:
  kind: enum
  members: [VAT]               # only what GB VAT needs; add a member when a jurisdiction does

TaxCategory:
  kind: enum
  members: [Standard, Reduced, ZeroRated]   # the three GB VAT rate bands
